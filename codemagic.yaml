workflows:
  ios-native:
    name: Crime Near Me (native)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Berfau ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stevenwilliams.crimemap
      vars:
        APP_STORE_APPLE_ID: 6836432396
      xcode: latest
    scripts:
      - name: Check history setup
        script: |
          if grep -q YOUR_GITHUB_USERNAME Sources/HistoryConfig.swift; then
            echo "WARNING: set your GitHub username in Sources/HistoryConfig.swift to enable history downloads"
          fi
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project CrimeNearMe.xcodeproj \
            --scheme CrimeNearMe
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
