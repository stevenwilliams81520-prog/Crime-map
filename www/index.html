<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Crime Map</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div class="top">
  <input id="pc" placeholder="Postcode" autocomplete="postal-code" autocapitalize="characters" enterkeyhint="search">
  <button class="btn go" id="goBtn">Go</button>
  <button class="btn" id="locBtn" aria-label="Use my location">📍</button>
</div>
<div class="hint" id="hint">Search a postcode, tap 📍, or tap the map</div>
<div class="toast" id="toast"></div>

<div class="sheet">
  <div class="row">
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="row">
    <select id="month" aria-label="Month"></select>
    <button class="btn filter" id="filterBtn">Filter <span id="filterCount"></span></button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<!-- Filter panel -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <button class="link" id="allBtn">Select all</button>
      <b>Crime types</b>
      <button class="link" id="noneBtn">Clear</button>
    </div>
    <div class="panel-body" id="filterList"></div>
    <button class="btn go done" id="doneBtn">Show results</button>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
